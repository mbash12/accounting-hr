notes:
  # create template for fixed asset category resource
  # also the taxes


models:
  # User model is handled by Laravel's default User model

  BusinessType:
    name: string:200
    code: string:50
    description: text
    is_active: boolean default:true
    softDeletes
    timestamps
    relationships:
      belongsTo: User:created_by_user

  Company:
    name: string:200
    description: text nullable
    tax_id: string:50 nullable
    fiscal_year_start: date
    fiscal_year_end: date
    tax_period: enum:monthly,quarterly,semi_annual,annual default:monthly
    is_active: boolean default:true
    settings: json nullable
    # Billing/Invoice Address
    billing_address_line_1: string:255 nullable
    billing_address_line_2: string:255 nullable
    billing_city: string:100 nullable
    billing_state: string:100 nullable
    billing_postal_code: string:20 nullable
    billing_country: string:100 nullable
    # Delivery Address
    delivery_address_line_1: string:255 nullable
    delivery_address_line_2: string:255 nullable
    delivery_city: string:100 nullable
    delivery_state: string:100 nullable
    delivery_postal_code: string:20 nullable
    delivery_country: string:100 nullable
    # Photo attachment
    photo: string nullable
    softDeletes
    timestamps
    relationships:
      belongsTo: BusinessType, User:created_by_user
  
  x_UserCompany:
    softDeletes
    timestamps
    relationships:
      belongsTo: User, Company, User:assigned_by_user

  PaymentTerm:
    name: string:100
    description: text
    due_days: integer
    is_active: boolean default:true
    softDeletes
    timestamps
    relationships:
      belongsTo: Company, User:created_by_user

  Bank:
    code: string:20
    name: string:200
    logo: string
    country: string:100
    clearing_code: string:20
    skn_code: string:20
    is_active: boolean default:true
    softDeletes
    timestamps
    relationships:
      belongsTo: Company, User:created_by_user

  Expedition:
    name: string:200
    code: string:50
    is_active: boolean default:true
    softDeletes
    timestamps
    relationships:
      belongsTo: Company, User:created_by_user

  xx_AccountClassification:
    name: string:200
    code: string:50
    classification_type: enum:asset,liability,equity,revenue,expense
    description: text
    is_active: boolean default:true
    softDeletes
    timestamps
    relationships:
      belongsTo: AccountClassification:parent, Company, User:created_by_user
      hasMany: AccountClassification:children

  Department:
    name: string:200
    code: string:50
    is_active: boolean default:true
    softDeletes
    timestamps
    relationships:
      belongsTo: Company, User:created_by_user

  Account:
    code: string:50
    name: string:200
    account_type: enum:current_asset,fixed_asset,current_liability,long_term_liability,equity,revenue,expense,cost_of_goods_sold
    is_cash_bank: boolean default:false
    is_active: boolean default:true
    level: integer default:1
    opening_balance: decimal:15,2 default:0
    current_balance: decimal:15,2 default:0
    softDeletes
    timestamps
    relationships:
      belongsTo: Account:parent, AccountClassification, Company
      hasMany: Account:children

  x_CostCenter:
    name: string:200
    code: string:50
    is_active: boolean default:true
    softDeletes
    timestamps
    relationships:
      belongsTo: Department, Company, User:created_by_user

  Tax:
    name: string:200
    code: string:50
    tax_percentage: decimal:10,2
    tax_type: enum:vat,sales_tax,service_tax,withholding_tax,excise_tax
    is_purchase_tax: boolean default:false
    is_sales_tax: boolean default:false
    effective_date: date
    expiry_date: date nullable
    compound_tax: boolean default:false
    is_active: boolean default:true
    softDeletes
    timestamps
    relationships:
      belongsTo: Account:purchase_account, Account:sales_account, Company, User:created_by_user

  Unit:
    code: string:20
    name: string:100
    description: text
    is_active: boolean default:true
    softDeletes
    timestamps
    relationships:
      belongsTo: Company, User:created_by_user

  ProductGroup:
    name: string:200
    is_active: boolean default:true
    shipping_type: enum:physical,digital
    softDeletes
    timestamps
    relationships:
      belongsTo: Company, User:created_by_user

  Warehouse:
    name: string:200
    code: string:50
    is_active: boolean default:true
    softDeletes
    timestamps
    relationships:
      belongsTo: Company, User:created_by_user

  x_TransactionClassification:
    name: string:200
    code: string:50
    description: text
    classification_type: enum:operating,investing,financing,non_operating
    tax_impact: enum:taxable,exempt,zero_rated,out_of_scope nullable
    reporting_category: string:100 nullable
    is_active: boolean default:true
    softDeletes
    timestamps
    relationships:
      belongsTo: Account:default_account, Company, User:created_by_user

  DocumentNumbering:
    document_type: string:50
    prefix: string:20
    format: string:50
    next_number: integer default:1
    reset_period: enum:never,daily,weekly,monthly,quarterly,yearly
    is_active: boolean default:true
    softDeletes
    timestamps
    relationships:
      belongsTo: Company, User:created_by_user

  FixedAssetCategory:
    name: string:200
    depreciation_method: enum:straight_line,declining_balance,double_declining,sum_of_years,units_of_production
    useful_life: integer
    is_active: boolean default:true
    softDeletes
    timestamps
    relationships:
      belongsTo: Account:sales_account, Account:asset_account, Account:accumulated_depreciation_account, Account:depreciation_account, Company, User:created_by_user

  x_FinancialYear:
    name: string:100
    start_date: date
    end_date: date
    is_current: boolean default:false
    is_locked: boolean default:false
    softDeletes
    timestamps
    relationships:
      belongsTo: Company, User:created_by_user

  Contact:
    name: string:200
    email: string:150 nullable
    phone: string:50 nullable
    tax: string:50 nullable
    contact_code: string:50
    contact_person: string:200 nullable
    is_customer: boolean default:false
    is_supplier: boolean default:false
    is_employee: boolean default:false
    is_sales: boolean default:false
    credit_limit: decimal:15,2 default:0
    is_active: boolean default:true
    # Billing/Invoice Address
    billing_address_line_1: string:255 nullable
    billing_address_line_2: string:255 nullable
    billing_city: string:100 nullable
    billing_state: string:100 nullable
    billing_postal_code: string:20 nullable
    billing_country: string:100 nullable
    # Delivery Address
    delivery_address_line_1: string:255 nullable
    delivery_address_line_2: string:255 nullable
    delivery_city: string:100 nullable
    delivery_state: string:100 nullable
    delivery_postal_code: string:20 nullable
    delivery_country: string:100 nullable
    # Supporting document
    supporting_document: string nullable
    softDeletes
    timestamps
    relationships:
      belongsTo: PaymentTerm, Company, User:created_by_user

  Product:
    name: string:200
    code: string:50
    description: text nullable
    cost_price: decimal:15,2 default:0
    selling_price: decimal:15,2 default:0
    reorder_level: decimal:15,2 default:0
    max_stock: decimal:15,2 default:0
    weight: decimal:10,3 default:0
    product_type: string:50 default:simple
    is_active: boolean default:true
    # Image attachment
    image: string nullable
    softDeletes
    timestamps
    relationships:
      belongsTo: Unit, ProductGroup, Company, User:created_by_user

  X_BankAccount:
    account_number: string:50
    account_name: string:200
    account_type: enum:checking,savings,credit_card,investment default:checking
    balance: decimal:15,2 default:0
    is_active: boolean default:true
    softDeletes
    timestamps
    relationships:
      belongsTo: Bank, Company, User:created_by_user

  FixedAsset:
    name: string:200
    code: string:50
    location: string:200 nullable
    acquisition_date: date
    description: text nullable
    acquisition_value: decimal:15,2
    monthly_depreciation: decimal:15,2 default:0
    depreciation_method: enum:straight_line,declining_balance,double_declining,sum_of_years,units_of_production default:straight_line
    accumulated_depreciation: decimal:15,2 default:0
    useful_life: integer
    book_value: decimal:15,2
    is_active: boolean default:true
    softDeletes
    timestamps
    relationships:
      belongsTo: FixedAssetCategory:category, Department, JournalEntry:transaction_in, Company, User:created_by_user

  x_Project:
    job_number: string:50
    status: enum:planning,in_progress,on_hold,completed,cancelled default:planning
    customer_po_number: string:100 nullable
    title: string:200
    description: text nullable
    total_value: decimal:15,2 default:0
    total_invoiced: decimal:15,2 default:0
    total_paid: decimal:15,2 default:0
    total_delivered: decimal:15,2 default:0
    softDeletes
    timestamps
    relationships:
      belongsTo: Contact:customer, Company, User:created_by_user

  x_Task:
    task_number: string:50 unique
    task_type: enum:milestone,deliverable,issue,bug_fix,feature,review
    title: string:200
    description: text
    due_date: date nullable
    status: enum:todo,in_progress,review,completed,cancelled
    completed_at: timestamp nullable
    softDeletes
    timestamps
    relationships:
      belongsTo: User:assigned_to, Project:job, Company
      belongsToMany: User

  x_TaskUpdate:
    update_text: text
    softDeletes
    timestamps
    relationships:
      belongsTo: Task, User:updated_by_user

  x_Milestone:
    milestone_number: string:50 unique
    milestone_type: enum:phase,deliverable,payment,review,acceptance
    title: string:200
    description: text
    target_date: date
    actual_date: date nullable
    pending_history: json nullable
    softDeletes
    timestamps
    relationships:
      belongsTo: Project:job, Company

  x_AdvancePayment:
    advance_number: string:50 unique
    date: date
    amount: bigint
    description: text
    status: enum:pending,active,partially_used,fully_used,expired,cancelled
    used_amount: bigint default:0
    remaining_amount: bigint
    expiry_date: date nullable
    softDeletes
    timestamps
    relationships:
      belongsTo: Contact:customer, Company, User:created_by_user
      hasOne: AdvancePaymentAllocation:allocation

  SalesOrder:
    order_number: string:50
    order_type: enum:standard,cash,credit,consignment,service default:standard
    date: date
    is_closed: boolean default:false
    reference_no: string nullable
    description: text nullable
    other_charges: decimal:15,2 default:0
    discount: decimal:15,2 default:0
    subtotal: decimal:15,2 default:0
    tax_amount: decimal:15,2 default:0
    total_amount: decimal:15,2 default:0
    status: enum:draft,confirmed,partially_delivered,completed,cancelled default:draft
    softDeletes
    timestamps
    relationships:
      belongsTo: Project:job, Contact:customer, AdvancePayment, Account:other_charges_account, Account:discount_account, Company, User:created_by_user, User:updated_by_user

  SalesOrderItem:
    quantity: decimal:15,2
    unit_price: decimal:15,2
    total: decimal:15,2
    description: text nullable
    discount: decimal:15,2 default:0
    discount_percentage: decimal:5,2 default:0
    tax_amount: decimal:15,2 default:0
    delivered_quantity: decimal:15,2 default:0
    softDeletes
    timestamps
    relationships:
      belongsTo: SalesOrder, Product, Unit, Tax

  DeliveryDocument:
    delivery_type: enum:full,partial,return,replacement,sample
    date: date
    is_closed: boolean default:false
    reference_no: string
    description: text
    delivery_status: enum:pending,picked,in_transit,delivered,failed,cancelled
    tracking_number: string:100 nullable
    bast_document: string nullable
    tpb_document: string nullable
    dispatch_time: timestamp nullable
    completion_time: timestamp nullable
    softDeletes
    timestamps
    relationships:
      belongsTo: Contact:customer, SalesOrder, Project:job, Expedition, Company, User:created_by_user, User:updated_by_user

  DeliveryDocumentItem:
    total_quantity: bigint
    description: text
    delivery_allocation: json
    softDeletes
    timestamps
    relationships:
      belongsTo: DeliveryDocument, Product, Unit, Warehouse

  SalesInvoice:
    invoice_number: string:50
    date: date
    due_date: date
    is_paid: boolean default:false
    reference_no: string nullable
    description: text nullable
    other_charges: decimal:15,2 default:0
    discount: decimal:15,2 default:0
    subtotal: decimal:15,2 default:0
    tax_amount: decimal:15,2 default:0
    total_amount: decimal:15,2 default:0
    paid_amount: decimal:15,2 default:0
    outstanding_amount: decimal:15,2 default:0
    is_advance_payment_invoice: boolean default:false
    is_settlement_invoice: boolean default:false
    status: enum:draft,sent,overdue,paid,partially_paid,written_off,cancelled default:draft
    softDeletes
    timestamps
    relationships:
      belongsTo: Contact:customer, SalesOrder, Project:job, Account:other_charges_account, Account:discount_account, Company, User:created_by_user, User:updated_by_user

  SalesInvoiceItem:
    quantity: decimal:15,2
    unit_price: decimal:15,2
    total: decimal:15,2
    description: text nullable
    discount: decimal:15,2 default:0
    discount_percentage: decimal:5,2 default:0
    tax_amount: decimal:15,2 default:0
    softDeletes
    timestamps
    relationships:
      belongsTo: SalesInvoice, Product, Unit, Tax, CostCenter

  SalesReturn:
    date: date
    reference_no: string
    description: text
    status: enum:requested,approved,received,processed,rejected,cancelled
    softDeletes
    timestamps
    relationships:
      belongsTo: Contact:customer, SalesInvoice, Project:job, Company, User:created_by_user, User:updated_by_user

  SalesReturnItem:
    quantity: bigint
    description: text
    return_reason: text
    softDeletes
    timestamps
    relationships:
      belongsTo: SalesReturn, Product, Unit

  x_ReceivablePayment:
    payment_number: string:50
    payment_date: date
    reference_no: string nullable
    description: text nullable
    total_payment: decimal:15,2
    payment_method: enum:cash,bank_transfer,check,credit_card,debit_card,online_payment,other default:bank_transfer
    status: enum:pending,completed,failed,cancelled default:pending
    softDeletes
    timestamps
    relationships:
      belongsTo: Contact:customer, BankAccount, Project:job, Company, User:created_by_user, User:updated_by_user

  x_ReceivablePaymentItem:
    date: date
    amount: decimal:15,2
    paid_amount: decimal:15,2
    discount_amount: decimal:15,2 default:0
    write_off_amount: decimal:15,2 default:0
    set_payment: decimal:15,2
    softDeletes
    timestamps
    relationships:
      belongsTo: ReceivablePayment, SalesInvoice

  x_OverpaymentRefund:
    date: date
    reference_no: string
    description: text
    amount: bigint
    status: enum:pending,processed,failed,cancelled
    softDeletes
    timestamps
    relationships:
      belongsTo: Contact:customer, ReceivablePayment, Company, User:created_by_user

  PurchaseOrder:
    purchase_order_no: string
    date: date
    reference_no: string
    description: text
    other_charges: bigint default:0
    discount: bigint default:0
    subtotal: bigint default:0
    tax_amount: bigint default:0
    total: bigint default:0
    status: enum:draft,sent,confirmed,partially_received,completed,cancelled
    softDeletes
    timestamps
    relationships:
      belongsTo: Contact:supplier, Project:job, Department, Account:other_charges_account, Account:discount_account, Company, User:created_by_user, User:updated_by_user

  PurchaseOrderItem:
    quantity: bigint
    unit_price: bigint
    total: bigint
    description: text
    received_quantity: bigint default:0
    softDeletes
    timestamps
    relationships:
      belongsTo: PurchaseOrder, Product, Unit, Tax

  GoodsReceipt:
    date: date
    is_closed: boolean default:false
    reference_no: string
    description: text
    status: enum:pending,received,inspected,approved,rejected,cancelled
    softDeletes
    timestamps
    relationships:
      belongsTo: Contact:supplier, PurchaseOrder, Project:job, Company, User:created_by_user, User:updated_by_user

  GoodsReceiptItem:
    quantity: bigint
    description: text
    batch_number: string:50 nullable
    expiry_date: date nullable
    unit_cost: bigint default:0
    softDeletes
    timestamps
    relationships:
      belongsTo: GoodsReceipt, Product, Unit, Warehouse

  PurchaseInvoice:
    date: date
    due_date: date
    is_paid: boolean default:false
    reference_no: string
    description: text
    other_charges: bigint default:0
    discount: bigint default:0
    advance_payment: bigint default:0
    subtotal: bigint default:0
    tax_amount: bigint default:0
    total: bigint default:0
    paid_amount: bigint default:0
    outstanding_amount: bigint default:0
    status: enum:draft,received,approved,paid,partially_paid,disputed,cancelled
    softDeletes
    timestamps
    relationships:
      belongsTo: Contact:supplier, PurchaseOrder, Project:job, Account:other_charges_account, Account:discount_account, Account:advance_payment_account, Company, User:created_by_user, User:updated_by_user

  PurchaseInvoiceItem:
    quantity: bigint
    unit_price: bigint
    total: bigint
    description: text
    softDeletes
    timestamps
    relationships:
      belongsTo: PurchaseInvoice, Product, Unit, Tax, CostCenter

  PurchaseReturn:
    date: date
    reference_no: string
    description: text
    status: enum:requested,approved,shipped,received,processed,rejected,cancelled
    softDeletes
    timestamps
    relationships:
      belongsTo: Contact:supplier, PurchaseInvoice, Project:job, Company, User:created_by_user, User:updated_by_user

  PurchaseReturnItem:
    quantity: bigint
    description: text
    return_reason: text
    softDeletes
    timestamps
    relationships:
      belongsTo: PurchaseReturn, Product, Unit

  x_PayablePayment:
    payment_date: date
    reference_no: string
    description: text
    total_payment: bigint
    payment_method: enum:cash,bank_transfer,check,credit_card,debit_card,online_payment,other
    status: enum:pending,completed,failed,cancelled,refunded
    softDeletes
    timestamps
    relationships:
      belongsTo: Contact:supplier, BankAccount, Project:job, Company, User:created_by_user, User:updated_by_user

  x_PayablePaymentItem:
    date: date
    amount: bigint
    paid_amount: bigint
    discount_amount: bigint default:0
    write_off_amount: bigint default:0
    set_payment: bigint
    softDeletes
    timestamps
    relationships:
      belongsTo: PayablePayment, PurchaseInvoice

  x_OverpaymentReceipt:
    date: date
    reference_no: string
    description: text
    amount: bigint
    status: enum:pending,processed,failed,cancelled
    softDeletes
    timestamps
    relationships:
      belongsTo: Contact:supplier, PayablePayment, Company, User:created_by_user

  x_BankReconciliation:
    statement_date: date
    statement_balance: bigint
    book_balance: bigint
    reconciliation_date: date
    status: enum:pending,in_progress,completed,failed
    reconciled_at: timestamp nullable
    difference: bigint default:0
    softDeletes
    timestamps
    relationships:
      belongsTo: BankAccount, User:reconciled_by_user, Company, User:created_by_user

  x_CheckDisbursement:
    date: date
    check_number: string
    reference_no: string
    due_date: date
    description: text
    amount: bigint
    status: enum:draft,issued,cleared,bounced,cancelled,void
    softDeletes
    timestamps
    relationships:
      belongsTo: BankAccount, Company, User:created_by_user

  CashDisbursement:
    date: date
    reference_no: string
    description: text
    total: bigint
    status: enum:draft,approved,processed,cancelled
    softDeletes
    timestamps
    relationships:
      belongsTo: Contact:recipient, BankAccount:from_account, Company, User:created_by_user, User:updated_by_user

  CashDisbursementItem:
    amount: bigint
    description: text
    softDeletes
    timestamps
    relationships:
      belongsTo: CashDisbursement, Account

  AdvanceDisbursement:
    date: date
    reference_no: string
    description: text
    total: bigint
    status: enum:draft,approved,processed,cancelled
    softDeletes
    timestamps
    relationships:
      belongsTo: Contact:recipient, BankAccount:from_account, Company, User:created_by_user, User:updated_by_user

  AdvanceDisbursementItem:
    amount: bigint
    description: text
    softDeletes
    timestamps
    relationships:
      belongsTo: AdvanceDisbursement, TransactionClassification

  CashReceipt:
    date: date
    reference_no: string
    description: text
    total: bigint
    status: enum:draft,approved,processed,cancelled
    softDeletes
    timestamps
    relationships:
      belongsTo: Contact:recipient, BankAccount:to_account, Company, User:created_by_user, User:updated_by_user

  CashReceiptItem:
    amount: bigint
    description: text
    softDeletes
    timestamps
    relationships:
      belongsTo: CashReceipt, Account

  AdvanceReceipt:
    date: date
    reference_no: string
    description: text
    total: bigint
    status: enum:draft,approved,processed,cancelled
    softDeletes
    timestamps
    relationships:
      belongsTo: Contact:recipient, BankAccount:to_account, Company, User:created_by_user, User:updated_by_user

  AdvanceReceiptItem:
    amount: bigint
    description: text
    softDeletes
    timestamps
    relationships:
      belongsTo: AdvanceReceipt, TransactionClassification

  CashTransfer:
    date: date
    reference_no: string
    description: text
    amount: bigint
    status: enum:draft,approved,processed,cancelled
    softDeletes
    timestamps
    relationships:
      belongsTo: BankAccount:from_account, BankAccount:to_account, Company, User:created_by_user

  x_InventoryTransaction:
    transaction_type: enum:purchase,sale,return_in,return_out,adjustment,transfer_in,transfer_out,opname
    quantity: bigint
    unit_cost: bigint default:0
    total_cost: bigint default:0
    reference_no: string
    date: date
    description: text
    batch_number: string:50 nullable
    expiry_date: date nullable
    softDeletes
    timestamps
    relationships:
      belongsTo: Product, Warehouse, Company, User:created_by_user

  x_InventoryAdjustment:
    date: date
    reference_no: string
    description: text
    status: enum:draft,approved,processed,cancelled
    softDeletes
    timestamps
    relationships:
      belongsTo: Warehouse, Company, User:created_by_user, User:updated_by_user

  x_InventoryAdjustmentItem:
    quantity: bigint
    cost_of_goods_sold: bigint default:0
    description: text
    softDeletes
    timestamps
    relationships:
      belongsTo: InventoryAdjustment, Product, Account, Unit

  x_StockOpname:
    date: date
    reference_no: string
    description: text
    status: enum:draft,in_progress,completed,approved,rejected
    softDeletes
    timestamps
    relationships:
      belongsTo: Warehouse, Company, User:created_by_user, User:updated_by_user

  x_StockOpnameItem:
    quantity: bigint
    book_stock: bigint
    physical_stock: bigint
    difference: bigint
    description: text
    softDeletes
    timestamps
    relationships:
      belongsTo: StockOpname, Product, Unit

  x_WarehouseTransfer:
    date: date
    reference_no: string
    description: text
    status: enum:draft,approved,processed,cancelled
    softDeletes
    timestamps
    relationships:
      belongsTo: Warehouse:from_warehouse, Warehouse:to_warehouse, Company, User:created_by_user, User:updated_by_user

  x_WarehouseTransferItem:
    quantity: bigint
    description: text
    softDeletes
    timestamps
    relationships:
      belongsTo: WarehouseTransfer, Product, Unit

  x_FixedAssetTransaction:
    date: date
    reference_no: string
    description: text
    journal_value: bigint
    asset_value: bigint
    difference: bigint
