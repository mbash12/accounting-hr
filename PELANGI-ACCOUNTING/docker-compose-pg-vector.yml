services:
  # PHP Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app
    container_name: accounting-hr-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - laravel-network
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    environment:
      - TMPDIR=/tmp

  # Initialization Service
  init:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app
    container_name: accounting-hr-init
    volumes:
      - ./:/var/www/html
    networks:
      - laravel-network
    depends_on:
      - postgres
    env_file:
      - .env
    command: bash -c "cd /var/www/html && ./docker-init.sh"
    profiles:
      - init

  # Nginx Service
  nginx:
    image: nginx:alpine
    container_name: accounting-hr-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html
      - ./docker-compose/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker-compose/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel-network
    depends_on:
      - app

  # PostgreSQL Service
  postgres:
    image: pgvector/pgvector:pg16
    container_name: accounting-hr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./accounting-hr.sql:/docker-entrypoint-initdb.d/accounting-hr.sql
    ports:
      - "5433:5432"
    networks:
      - laravel-network

  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: accounting-hr-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    networks:
      - laravel-network

  # Adminer for database management
  adminer:
    image: adminer:latest
    container_name: accounting-hr-adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    networks:
      - laravel-network
    depends_on:
      - postgres

networks:
  laravel-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
